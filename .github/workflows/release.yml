# Release build: produces a Windows installer and attaches it to a draft
# GitHub release. Adapted from tauri.app/distribute/pipelines/github/ (the
# tauri-action@v1 flow), pinned to a windows-latest runner since opsrzr is
# Windows-only.
#
# Trigger it by pushing a tag like `app-v0.1.0` (matching the version in
# src-tauri/tauri.conf.json) or by running it manually from the Actions tab.
# The release is created as a DRAFT so a human reviews and publishes it.
name: release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # tauri-action needs write access to create the release + upload assets.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "opsrzr v__VERSION__"
          releaseBody: |
            opsrzr Windows installer.

            This build is unsigned, so Windows SmartScreen may warn on first
            run — choose "More info" → "Run anyway". See the README for details.
          releaseDraft: true
          prerelease: false
